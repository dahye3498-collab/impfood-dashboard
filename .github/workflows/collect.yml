name: 검역데이터 수집

# ⚠ 식약처 API가 해외 IP를 차단해서 GitHub 러너(미국)에서는 수집이 안 된다.
# 정기 수집은 로컬 PC 예약 작업(scripts/monthly-collect.ps1)이 담당하고,
# 이 워크플로는 수동 실행용으로만 남겨둔다 (셀프호스트 러너를 쓰게 되면 재활성화).
on:
  workflow_dispatch:
    inputs:
      from:
        description: '시작 월 (YYYY-MM, 비우면 전월)'
        required: false
      to:
        description: '끝 월 (YYYY-MM, 비우면 시작 월과 동일)'
        required: false
      replace:
        description: '기존 데이터를 지우고 재수집'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 수집 실행
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REPLACE: ${{ inputs.replace }}
        run: |
          ARGS=""
          if [ -n "$FROM" ]; then ARGS="--from $FROM"; fi
          if [ -n "$TO" ]; then ARGS="$ARGS --to $TO"; fi
          # 정기 실행(입력 없음)은 항상 --replace: 전월 데이터를 최신 상태로 동기화
          if [ "$REPLACE" = "true" ] || [ -z "$FROM" ]; then ARGS="$ARGS --replace"; fi
          node scripts/collect.mjs $ARGS

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 수집: $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          fi
